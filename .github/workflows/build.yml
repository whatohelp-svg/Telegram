name: Build Telegram APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject APP_ID and APP_HASH
      env:
        APP_ID: ${{ secrets.APP_ID }}
        APP_HASH: ${{ secrets.APP_HASH }}
      run: |
        BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
        sed -i "s/public static int APP_ID = 4;/public static int APP_ID = ${APP_ID};/" "$BUILD_VARS"
        sed -i "s/public static String APP_HASH = \".*\";/public static String APP_HASH = \"${APP_HASH}\";/" "$BUILD_VARS"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleAfatDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Risegram-APK
        path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
