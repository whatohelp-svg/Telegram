name: Build RiseGram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: risegram-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configure RiseGram API credentials
        env:
          RISEGRAM_API_ID: ${{ secrets.RISEGRAM_API_ID || secrets.APP_ID }}
          RISEGRAM_API_HASH: ${{ secrets.RISEGRAM_API_HASH || secrets.APP_HASH }}
        run: |
          if [ -z "$RISEGRAM_API_ID" ] || [ -z "$RISEGRAM_API_HASH" ]; then
            echo "::error::Set RISEGRAM_API_ID and RISEGRAM_API_HASH repository secrets"
            exit 1
          fi
          printf 'RISEGRAM_API_ID=%s\nRISEGRAM_API_HASH=%s\n' "$RISEGRAM_API_ID" "$RISEGRAM_API_HASH" > local.properties

      - name: Clean and build universal native Android APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleAfatDebug --stacktrace
          APK_PATH="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -s "$APK_PATH"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            if ! unzip -Z1 "$APK_PATH" | grep -q "^lib/$ABI/libtmessages.49.so$"; then
              echo "::error::APK is missing native Telegram library for ABI: $ABI"
              exit 1
            fi
          done
          echo "Verified all four native ABIs:"
          unzip -Z1 "$APK_PATH" | grep -E '^lib/(armeabi-v7a|arm64-v8a|x86|x86_64)/libtmessages\.49\.so$' | sort
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload RiseGram APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseGram-debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 14
