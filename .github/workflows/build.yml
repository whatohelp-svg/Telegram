name: Build Telegram APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой во вкладке Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install required NDK and CMake
        run: |
          sdkmanager "ndk;21.4.7075529" "cmake;3.10.2.4988404"

      - name: Inject APP_ID and APP_HASH
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          BUILD_VARS="TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"
          sed -i "s/public static int APP_ID = 4;/public static int APP_ID = $APP_ID;/g" $BUILD_VARS
          sed -i "s/public static String APP_HASH = \"014b35b6184100b085b0d0572f9b5103\";/public static String APP_HASH = \"$APP_HASH\";/g" $BUILD_VARS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleAfatDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTelegramMod-APK
          path: TMessagesProj/build/outputs/apk/afat/debug/*.apk
          
