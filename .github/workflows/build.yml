name: Build RiseGram APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: risegram-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Configure RiseGram API credentials
        env:
          RISEGRAM_API_ID: ${{ secrets.RISEGRAM_API_ID || secrets.APP_ID }}
          RISEGRAM_API_HASH: ${{ secrets.RISEGRAM_API_HASH || secrets.APP_HASH }}
        run: |
          if [ -z "$RISEGRAM_API_ID" ] || [ -z "$RISEGRAM_API_HASH" ]; then
            echo "::error::Set RISEGRAM_API_ID and RISEGRAM_API_HASH repository secrets"
            exit 1
          fi
          printf 'RISEGRAM_API_ID=%s\nRISEGRAM_API_HASH=%s\n' "$RISEGRAM_API_ID" "$RISEGRAM_API_HASH" > local.properties

      - name: Build native Android APK
        run: |
          chmod +x gradlew
          ./gradlew assembleAfatDebug --stacktrace

      - name: Upload RiseGram APK
        uses: actions/upload-artifact@v4
        with:
          name: RiseGram-debug-APK
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
